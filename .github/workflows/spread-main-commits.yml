name: spread-main-commits

on:
  push:
    branches: [ main ]

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.github-app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.github-app-token.outputs.token }}

      - name: Configure Git Author
        run: |
          git config --global user.name '${{ steps.github-app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}

      - name: Spread Commits
        run: |
          TARGET_BRANCHES=("with-gil" "without-gil")
          
          for BRANCH in "${TARGET_BRANCHES[@]}"; do
            echo "::group::Merging into $BRANCH"

            if git ls-remote --exit-code --heads origin $BRANCH; then
              echo "Branch $BRANCH exists on remote, checking out and merging"
              git checkout $BRANCH
              git merge main --ff-only
            else
              echo "Branch $BRANCH does not exist on remote, creating from main"
              git checkout -b $BRANCH main
            fi

            git push -u origin $BRANCH
            
            echo "::endgroup::"
          done
