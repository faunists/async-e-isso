name: CodSpeed

on:
  push:
    branches: [ with-gil, without-gil ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `with-gil` runs on the regular interpreter, `without-gil` on the
      # free-threaded one. The free-threaded build does not support the
      # `malloc` allocator CodSpeed uses by default, so it uses `mimalloc`.
      - name: Resolve Python version
        id: python
        env:
          # The branch being built decides the interpreter.
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            without-gil)
              version="3.14.7t"
              allocator="mimalloc"
              ;;
            *)
              version="3.14.7"
              allocator="malloc"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "allocator=$allocator" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: env PYTHONMALLOC=${{ steps.python.outputs.allocator }} uv run pytest tests/ --codspeed
